<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 5: React Custom Hooks</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #070707;
        color: #f7f7f7;
        font-family: Arial, Helvetica, sans-serif;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .app-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .gallery-section h1 {
        margin-bottom: 22px;
        text-align: center;
        font-size: clamp(1.8rem, 4vw, 3rem);
        letter-spacing: 0;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      .photo-card {
        min-height: 310px;
        overflow: hidden;
        border: 1px solid #757575;
        border-radius: 4px;
        background: #111;
      }

      .photo-card img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #222;
      }

      .photo-card__body {
        padding: 14px;
      }

      .photo-card h2 {
        margin: 0 0 8px;
        color: #fff;
        font-size: 1rem;
        line-height: 1.3;
      }

      .photo-card p {
        margin: 0;
        color: #bdbdbd;
        font-size: 0.9rem;
      }

      .state-panel {
        display: grid;
        min-height: 260px;
        place-items: center;
        gap: 14px;
        border: 1px solid #757575;
        border-radius: 4px;
        background: #111;
        text-align: center;
      }

      .state-panel h2,
      .state-panel p {
        margin: 0;
      }

      .state-panel--error {
        border-color: #f46d6d;
        color: #ffd4d4;
      }

      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #333;
        border-top-color: #79d84e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useEffect, useState } = React;
      const PHOTOS_URL = "https://picsum.photos/v2/list?page=2&limit=12";

      function useFetch(url) {
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        useEffect(() => {
          if (!url) {
            setData(null);
            setLoading(false);
            setError("No URL was provided.");
            return;
          }

          const controller = new AbortController();

          async function fetchData() {
            try {
              setLoading(true);
              setError(null);

              const response = await fetch(url, { signal: controller.signal });

              if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
              }

              const result = await response.json();
              setData(result);
            } catch (fetchError) {
              if (fetchError.name !== "AbortError") {
                setError(fetchError.message || "Something went wrong.");
                setData(null);
              }
            } finally {
              if (!controller.signal.aborted) {
                setLoading(false);
              }
            }
          }

          fetchData();

          return () => {
            controller.abort();
          };
        }, [url]);

        return { data, loading, error };
      }

      function PhotoCard({ photo }) {
        return React.createElement(
          "article",
          { className: "photo-card" },
          React.createElement("img", {
            src: photo.download_url,
            alt: photo.author,
            loading: "lazy"
          }),
          React.createElement(
            "div",
            { className: "photo-card__body" },
            React.createElement("h2", null, photo.author),
            React.createElement("p", null, `${photo.width} x ${photo.height}`)
          )
        );
      }

      function App() {
        const { data: photos, loading, error } = useFetch(PHOTOS_URL);

        return React.createElement(
          "main",
          { className: "app-shell" },
          loading &&
            React.createElement(
              "section",
              { className: "state-panel", "aria-live": "polite" },
              React.createElement("div", { className: "spinner" }),
              React.createElement("p", null, "Loading photos...")
            ),
          error &&
            React.createElement(
              "section",
              { className: "state-panel state-panel--error", role: "alert" },
              React.createElement("h2", null, "Unable to load photos"),
              React.createElement("p", null, error)
            ),
          !loading &&
            !error &&
            photos &&
            React.createElement(
              "section",
              { className: "gallery-section", "aria-labelledby": "gallery-title" },
              React.createElement("h1", { id: "gallery-title" }, "Photo Gallery"),
              React.createElement(
                "div",
                { className: "photo-grid" },
                photos.map((photo) =>
                  React.createElement(PhotoCard, { key: photo.id, photo })
                )
              )
            )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(App)
      );
    </script>
  </body>
</html>
